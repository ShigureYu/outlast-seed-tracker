name: build-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyqt6 openpyxl pyinstaller

      - name: Build database from xlsx
        run: python seed_importer.py

      - name: Build exe
        run: python -m PyInstaller --noconfirm --onefile --windowed --name OPPOverlay overlay.py

      - name: Assemble release folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release\data | Out-Null
          Copy-Item dist\OPPOverlay.exe release\
          Copy-Item data\seed.db release\data\
          Copy-Item README.md release\
          Compress-Archive -Path release\* -DestinationPath OPPOverlay.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OPPOverlay
          path: OPPOverlay.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: OPPOverlay.zip
          generate_release_notes: true
