name: build-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    env:
      # runner 默认 cp1252，脚本里有中文输出，统一成 UTF-8
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyqt6 pyinstaller

      - name: Verify bundled database
        shell: pwsh
        run: |
          if (-not (Test-Path 'data\seed.db')) { throw "仓库里缺少 data/seed.db" }
          python -c "import sqlite3;c=sqlite3.connect('data/seed.db');print('答案行数:', c.execute('SELECT COUNT(*) FROM CHJ_MT02').fetchone()[0]);c.close()"

      - name: Build exe
        # data/seed.db 一并塞进 exe：首次运行时自动释放到 exe 旁边，
        # 所以用户在 Release 里下载单个 exe 就能直接跑。
        run: python -m PyInstaller --noconfirm --onefile --windowed --name OPPOverlay --add-data "data/seed.db;data" overlay.py

      - name: Smoke test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          New-Item -ItemType Directory -Force -Path smoke | Out-Null
          Copy-Item dist\OPPOverlay.exe smoke\
          $env:TEMP = (Resolve-Path smoke).Path
          $env:TMP = $env:TEMP
          $p = Start-Process -FilePath smoke\OPPOverlay.exe -ArgumentList '--selftest' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "exe 自检失败，退出码 $($p.ExitCode)" }
          Get-Content smoke\selftest.txt
          if (-not (Select-String -Path smoke\selftest.txt -Pattern 'db_exists: True' -Quiet)) {
            throw "自检未找到内置数据库"
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OPPOverlay
          path: dist/OPPOverlay.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/OPPOverlay.exe
          generate_release_notes: true
          body: |
            ## 当前支持的关卡

            本版本仅支持 **对被告作出判决（CHJ_MT02）**。其它关卡正在陆续补充数据，
            更新数据后无需重新下载 exe，启动时会自动同步。

            ## 用法

            1. 下载 `OPPOverlay.exe`，放到一个你能找到的文件夹（不要放临时目录）。
            2. 双击运行。首次启动会在**同目录**下生成 `data/seed.db`，
               之后你的录入都保存在这个文件里，覆盖 exe 升级不会丢数据。
            3. 悬浮窗出现在屏幕正上方居中，可拖拽；`F5` 手动刷新，`Esc` 关闭，双击折叠。

            ## 数据更新

            启动后会自动检查仓库里的 `data/seed.db` 是否有更新：
            - 只补新记录，**不会覆盖**你本地已有的值；
            - 同一 seed 两边不同时，会让你逐条选择用哪个。

            游戏需使用**无边框窗口**模式，独占全屏下悬浮窗可能不显示。

            ## 免责声明

            本项目仅为个人学习 Python GUI 开发与日志解析的练手之作，附带数据库由朋友个人手动收集，
            仅供私下小范围交流测试，不保证数据准确性，请勿用于商业用途或公开传播。
            若权利方认为本项目侵权，请联系我，我会立即删除。
